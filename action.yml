name: ReleaseLint
description: Check whether a GitHub project is ready to release.
author: vaibanbuilds
inputs:
  repo:
    description: Repository in owner/name format.
    required: false
  since-tag:
    description: Base tag to compare against.
    required: true
  config:
    description: Path to .releaselint.json.
    required: false
    default: .releaselint.json
  version-file:
    description: Version file to inspect. Supports package.json, pyproject.toml, and Cargo.toml.
    required: false
    default: package.json
  token:
    description: GitHub token.
    required: false
    default: ${{ github.token }}
  format:
    description: Output format, markdown or json.
    required: false
    default: markdown
  comment:
    description: Post or update a sticky Markdown report comment on pull request events.
    required: false
    default: "false"
runs:
  using: node20
  main: src/action.js
