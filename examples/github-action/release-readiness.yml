name: Release readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      since-tag:
        description: Base tag to check from
        required: true
        default: v0.1.0

jobs:
  releaselint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: vaibanbuilds/releaselint@v0.1.2
        with:
          since-tag: ${{ inputs.since-tag || 'v0.1.0' }}
          version-file: package.json
          comment: ${{ github.event_name == 'pull_request' }}
