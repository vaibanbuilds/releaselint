name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node - <<'NODE'
          const pkg = require("./package.json");
          const expected = `v${pkg.version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            console.error(`Tag ${actual} does not match package version ${expected}`);
            process.exit(1);
          }
          NODE
      - run: npm run check
      - run: npm run check:json
      - run: npm run check:passing
      - run: npm run check:pyproject
      - run: npm run check:cargo
      - run: npm run check:init
      - run: npm run check:config
