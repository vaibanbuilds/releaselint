name: Publish

on:
  push:
    branches:
      - "publish/v*.*.*"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/publish/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Resolve release tag
        run: |
          set -euo pipefail
          package_tag="v$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF}" == refs/heads/publish/v* ]]; then
            release_tag="${GITHUB_REF_NAME#publish/}"
          else
            release_tag="${package_tag}"
          fi
          if [[ "${release_tag}" != "${package_tag}" ]]; then
            echo "Release tag ${release_tag} does not match package version ${package_tag}"
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
      - name: Create release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
      - name: Verify tag matches package version
        run: |
          node - <<'NODE'
          const pkg = require("./package.json");
          const expected = `v${pkg.version}`;
          const actual = process.env.RELEASE_TAG;
          if (actual !== expected) {
            console.error(`Tag ${actual} does not match package version ${expected}`);
            process.exit(1);
          }
          NODE
      - run: npm run check
      - run: npm run check:json
      - run: npm run check:passing
      - run: npm run check:pyproject
      - run: npm run check:cargo
      - run: npm run check:commits
      - run: npm run check:init
      - run: npm run check:config
      - run: npm publish --provenance --access public
