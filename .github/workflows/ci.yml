name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm run check:json
      - run: npm run check:passing
      - run: npm run check:pyproject
      - run: npm run check:cargo
      - run: npm run check:annotations
